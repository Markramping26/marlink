name: marlink_app
description: "MarLink - Connect. Locate. Stay Together. Real-Time Location Sharing, Communication & Safety Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^11.0.0
  battery_plus: ^6.2.1
  intl: ^0.19.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.1
  cached_network_image: ^3.3.1
  web_socket_channel: ^3.0.3
  cupertino_icons: ^1.0.6
  camera: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
